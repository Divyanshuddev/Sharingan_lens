<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharingan Lens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="lens-logo" viewBox="0 0 100 100">
          <defs>
            <g id="popup-tomoe">
              <circle cx="0" cy="-27" r="5.2" fill="#0D0D0D"/>
              <path d="M 0.0,-32.2 L -1.66,-31.77 L -3.29,-31.26 L -4.86,-30.67 L -6.38,-30.01 L -7.85,-29.28 L -9.26,-28.49 L -10.61,-27.64 L -11.9,-26.73 L -13.13,-25.78 L -14.3,-24.77 L -15.41,-23.72 L -16.45,-22.64 L -17.43,-21.53 L -18.35,-20.38 L -19.22,-19.22 L -20.06,-18.07 L -20.06,-18.07 L -18.99,-18.99 L -17.85,-19.83 L -16.66,-20.58 L -15.44,-21.25 L -14.18,-21.83 L -12.9,-22.34 L -11.6,-22.77 L -10.29,-23.11 L -8.98,-23.38 L -7.66,-23.57 L -6.34,-23.68 L -5.04,-23.71 L -3.75,-23.67 L -2.47,-23.55 L -1.22,-23.36 L 0.0,-23.1 Z" fill="#0D0D0D"/>
            </g>
          </defs>
          <circle cx="50" cy="50" r="46" fill="#DC1419" stroke="#0D0D0D" stroke-width="4"/>
          <circle cx="50" cy="50" r="27" fill="none" stroke="#0D0D0D" stroke-width="2" opacity="0.9"/>
          <circle cx="50" cy="50" r="9.5" fill="#0D0D0D"/>
          <g transform="translate(50, 50)">
            <use href="#popup-tomoe" />
            <use href="#popup-tomoe" transform="rotate(120)" />
            <use href="#popup-tomoe" transform="rotate(240)" />
          </g>
        </svg>
        <div class="brand-text">
          <h1>Sharingan Lens</h1>
          <span class="brand-badge">Visual Search & OCR</span>
        </div>
      </div>
      <button id="btn-open-options" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Default Search Form -->
    <section class="search-section">
      <form id="search-form" class="search-form">
        <input type="text" id="search-query-input" placeholder="Search with default search engine (new tab)..." required>
        <button type="submit" id="btn-search-default" class="btn-submit" title="Search in new tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </section>

    <!-- Quick Capture Action Grid -->
    <section class="action-grid">
      <button id="btn-select-area" class="action-card action-card-primary">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
          </svg>
        </div>
        <div class="action-details">
          <span class="action-title">Select Area</span>
          <span class="action-subtitle">Snip, copy text/image, or search</span>
        </div>
      </button>

      <button id="btn-capture-page" class="action-card">
        <div class="action-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <div class="action-details">
          <span class="action-title">Visible Screen</span>
          <span class="action-subtitle">Capture full visible page</span>
        </div>
      </button>
    </section>

    <!-- Dropzone / File Upload / Clipboard Area -->
    <section class="upload-section">
      <div id="dropzone" class="dropzone">
        <input type="file" id="file-input" accept="image/*" class="file-input">
        <div class="dropzone-content">
          <div class="dropzone-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <p class="dropzone-main">Drop image or <span class="browse-link">browse</span></p>
          <span class="dropzone-hint">Paste with Ctrl+V from clipboard</span>
        </div>
      </div>
    </section>

    <!-- Recent History Section -->
    <section class="history-section">
      <div class="history-header">
        <h2>Recent Searches</h2>
        <button id="btn-clear-history" class="btn-text">Clear</button>
      </div>
      <div id="history-list" class="history-list">
        <div class="history-empty">No recent searches yet</div>
      </div>
    </section>

    <!-- Loading State -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
      <div class="spinner"></div>
      <span id="loading-text">Searching in new tab...</span>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
